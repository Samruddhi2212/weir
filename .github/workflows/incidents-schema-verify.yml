name: Incidents Schema Verification (Part 4.1)

# Manual trigger only, matching metrics-store-verify.yml's pattern.
# Postgres-only - no Kafka/Flink/Iceberg needed, this schema has no
# dependency on any of them.
on:
  workflow_dispatch: {}

# docker-compose.yml requires WEIR_S3_ACCESS_KEY/WEIR_S3_SECRET_KEY with
# no default (a guessable default is worse than a required variable), and
# compose evaluates interpolation over the whole file - so `up`, `ps`,
# `logs` and `down` all need them, even in jobs that never touch S3.
# These are a throwaway local identity for an ephemeral container:
# SeaweedFS creates the identity from these same values at runtime, so
# any self-consistent pair works. Not a credential.
env:
  WEIR_S3_ACCESS_KEY: weir-local-ci
  WEIR_S3_SECRET_KEY: weir-local-ci-no-secret-needed

jobs:
  verify:
    name: Apply reliability/store/incidents_schema.sql and verify its constraints actually reject bad writes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psycopg
        run: pip install -r reliability/volume/requirements.txt
      - name: Start Postgres only
        run: docker compose up -d postgres
      - name: Wait for Postgres healthy
        run: |
          for i in $(seq 1 30); do
            line="$(docker compose ps | grep '^weir-postgres[[:space:]]' || true)"
            if [ -n "$line" ] && echo "$line" | grep -q "(healthy)"; then
              echo "postgres is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never became healthy"
          docker compose logs postgres
          exit 1
      - name: Run verify_incidents_schema.py
        run: python -u scripts/verify_incidents_schema.py --port "${POSTGRES_PORT:-5432}"
      - name: Show Postgres logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Tear down
        if: always()
        run: docker compose down -v
