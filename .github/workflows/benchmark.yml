name: Benchmark (Part 5)

# Manual trigger only, matching this project's other dispatch-only
# verification jobs. Heavier than all of them: four months of real TLC
# data downloaded and band-filtered, then replayed twice (clean, then
# injected) through the full Kafka/Flink/Postgres pipeline.
#
# Per V4 this is meant to be dispatched repeatedly - a single green run
# is not a result. Nothing here tunes a detector (hard rule 3).
on:
  workflow_dispatch: {}

# docker-compose.yml requires WEIR_S3_ACCESS_KEY/WEIR_S3_SECRET_KEY with
# no default (a guessable default is worse than a required variable), and
# compose evaluates interpolation over the whole file - so `up`, `ps`,
# `logs` and `down` all need them, even in jobs that never touch S3.
# These are a throwaway local identity for an ephemeral container:
# SeaweedFS creates the identity from these same values at runtime, so
# any self-consistent pair works. Not a credential.
env:
  WEIR_S3_ACCESS_KEY: weir-local-ci  # pragma: allowlist secret
  WEIR_S3_SECRET_KEY: weir-local-ci-no-secret-needed  # pragma: allowlist secret
  # docker-compose.yml and every Postgres-touching script now require
  # this too, same reasoning. Throwaway value for an ephemeral
  # container that initialises its own superuser from it.
  POSTGRES_PASSWORD: weir-local-ci  # pragma: allowlist secret

jobs:
  benchmark:
    name: Clean + injected replay, measure detection rate / FP rate / latency
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pyarrow kafka-python==3.0.11
          pip install -r reliability/volume/requirements.txt
      - name: Build Flink image
        run: docker compose build flink-jobmanager flink-taskmanager
      - name: Start Kafka, Postgres, Flink
        run: docker compose up -d kafka postgres flink-jobmanager flink-taskmanager
      - name: Wait for services healthy
        run: |
          EXPECTED_SERVICES="weir-kafka weir-postgres weir-flink-jobmanager weir-flink-taskmanager"
          WAITED=0
          MAX_WAIT=180
          while true; do
            PS_OUTPUT="$(docker compose ps)"
            all_healthy=1
            for svc in $EXPECTED_SERVICES; do
              line="$(echo "$PS_OUTPUT" | grep "^$svc[[:space:]]" || true)"
              if [ -z "$line" ] || ! echo "$line" | grep -q "(healthy)"; then
                all_healthy=0
                break
              fi
            done
            [ "$all_healthy" -eq 1 ] && break
            WAITED=$((WAITED + 5))
            if [ "$WAITED" -ge "$MAX_WAIT" ]; then
              echo "$PS_OUTPUT"
              docker compose logs kafka postgres flink-jobmanager flink-taskmanager
              echo "FAIL: not all of [$EXPECTED_SERVICES] healthy after ${MAX_WAIT}s"
              exit 1
            fi
            sleep 5
          done
          echo "$PS_OUTPUT"
      - name: Apply the incidents schema
        run: |
          docker compose exec -T postgres psql -U weir -d weir_catalog \
            < reliability/store/incidents_schema.sql
      - name: Download the months the contiguous span covers
        # 12 contiguous weeks at 0.85 warmup = 10.2 weekly samples per
        # bucket (612 observations vs the 480 floor) before injections
        # start.
        #
        # Runs 34757520031 (12w) and 34885328884 (10w) were both killed
        # at the ceiling, but not because the span was too long: every
        # window was being processed as a SAVEPOINT inside one
        # never-committed transaction, so per-window cost grew with the
        # number of windows already done (~172/s falling to ~14/s, and
        # resetting at each detector boundary). Fixed in
        # adapter.release_snapshot. 10 weeks was the fallback while that
        # was unexplained; with a flat rate the longer span fits and
        # buys the better baseline maturity, so it goes back to 12.
        run: |
          for MONTH in 2024-10 2024-11 2024-12; do
            python ingestion/replay/download_tlc_data.py --year-month "$MONTH" --output-dir data/tlc
          done
      - name: Run the benchmark
        # The sampler runs concurrently and is started first so it
        # captures the whole run, including whatever happens in the
        # stretch that went silent for 4h36m in run 34757520031. It is
        # backgrounded inside this step rather than given its own, so
        # the runner never has to keep a process alive across steps.
        # If the job is killed at the ceiling neither trap nor kill
        # fires, which is fine: the log is written line-buffered as it
        # goes and the upload below is if: always().
        run: |
          python -u scripts/sample_pg_activity.py \
            --out pg-activity.log \
            --interval 5 \
            --port "${POSTGRES_PORT:-5432}" &
          SAMPLER_PID=$!
          trap 'kill "$SAMPLER_PID" 2>/dev/null || true' EXIT

          python -u benchmarks/run_benchmark.py \
            --input data/tlc/yellow_tripdata_2024-10.parquet \
                    data/tlc/yellow_tripdata_2024-11.parquet \
                    data/tlc/yellow_tripdata_2024-12.parquet \
            --span-weeks 12 \
            --warmup-fraction 0.85 \
            --populate-timeout 7200 \
            --bootstrap-server localhost:${KAFKA_EXTERNAL_PORT:-29092}
      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/*.json
          if-no-files-found: warn
      - name: Upload the Postgres activity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-activity
          path: pg-activity.log
          if-no-files-found: warn
      - name: Show logs on failure
        if: failure()
        run: docker compose logs kafka postgres flink-jobmanager flink-taskmanager
      - name: Tear down
        if: always()
        run: docker compose down -v
