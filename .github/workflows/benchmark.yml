name: Benchmark (Part 5)

# Manual trigger only, matching this project's other dispatch-only
# verification jobs. Heavier than all of them: four months of real TLC
# data downloaded and band-filtered, then replayed twice (clean, then
# injected) through the full Kafka/Flink/Postgres pipeline.
#
# Per V4 this is meant to be dispatched repeatedly - a single green run
# is not a result. Nothing here tunes a detector (hard rule 3).
on:
  workflow_dispatch: {}

jobs:
  benchmark:
    name: Clean + injected replay, measure detection rate / FP rate / latency
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pyarrow kafka-python==3.0.11
          pip install -r reliability/volume/requirements.txt
      - name: Build Flink image
        run: docker compose build flink-jobmanager flink-taskmanager
      - name: Start Kafka, Postgres, Flink
        run: docker compose up -d kafka postgres flink-jobmanager flink-taskmanager
      - name: Wait for services healthy
        run: |
          EXPECTED_SERVICES="weir-kafka weir-postgres weir-flink-jobmanager weir-flink-taskmanager"
          WAITED=0
          MAX_WAIT=180
          while true; do
            PS_OUTPUT="$(docker compose ps)"
            all_healthy=1
            for svc in $EXPECTED_SERVICES; do
              line="$(echo "$PS_OUTPUT" | grep "^$svc[[:space:]]" || true)"
              if [ -z "$line" ] || ! echo "$line" | grep -q "(healthy)"; then
                all_healthy=0
                break
              fi
            done
            [ "$all_healthy" -eq 1 ] && break
            WAITED=$((WAITED + 5))
            if [ "$WAITED" -ge "$MAX_WAIT" ]; then
              echo "$PS_OUTPUT"
              docker compose logs kafka postgres flink-jobmanager flink-taskmanager
              echo "FAIL: not all of [$EXPECTED_SERVICES] healthy after ${MAX_WAIT}s"
              exit 1
            fi
            sleep 5
          done
          echo "$PS_OUTPUT"
      - name: Apply the incidents schema
        run: |
          docker compose exec -T postgres psql -U weir -d weir_catalog \
            < reliability/store/incidents_schema.sql
      - name: Download four months of real NYC TLC data
        # Warming one bucket needs ~8 weekly occurrences of its hour;
        # four months gives ~17, leaving real headroom to score in.
        run: |
          for MONTH in 2024-10 2024-11 2024-12 2025-01; do
            python ingestion/replay/download_tlc_data.py --year-month "$MONTH" --output-dir data/tlc
          done
      - name: Run the benchmark
        run: |
          python -u benchmarks/run_benchmark.py \
            --input data/tlc/yellow_tripdata_2024-10.parquet \
                    data/tlc/yellow_tripdata_2024-11.parquet \
                    data/tlc/yellow_tripdata_2024-12.parquet \
                    data/tlc/yellow_tripdata_2025-01.parquet \
            --bootstrap-server localhost:${KAFKA_EXTERNAL_PORT:-29092}
      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/*.json
          if-no-files-found: warn
      - name: Show logs on failure
        if: failure()
        run: docker compose logs kafka postgres flink-jobmanager flink-taskmanager
      - name: Tear down
        if: always()
        run: docker compose down -v
