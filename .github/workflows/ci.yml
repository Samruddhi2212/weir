name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# docker-compose.yml requires WEIR_S3_ACCESS_KEY/WEIR_S3_SECRET_KEY with
# no default (a guessable default is worse than a required variable), and
# compose evaluates interpolation over the whole file - so `up`, `ps`,
# `logs` and `down` all need them, even in jobs that never touch S3.
# These are a throwaway local identity for an ephemeral container:
# SeaweedFS creates the identity from these same values at runtime, so
# any self-consistent pair works. Not a credential.
env:
  WEIR_S3_ACCESS_KEY: weir-local-ci  # pragma: allowlist secret
  WEIR_S3_SECRET_KEY: weir-local-ci-no-secret-needed  # pragma: allowlist secret
  # docker-compose.yml and every Postgres-touching script now require
  # this too, same reasoning. Throwaway value for an ephemeral
  # container that initialises its own superuser from it.
  POSTGRES_PASSWORD: weir-local-ci  # pragma: allowlist secret

jobs:
  secrets:
    name: Secret scan (S2)
    runs-on: ubuntu-latest
    # CLAUDE.md S2 claims "gitleaks or detect-secrets runs in pre-commit
    # and CI." The pre-commit half was configured but the CI half never
    # existed, and the local hook was not installed either - so the
    # control had never actually run on a single commit. Found during a
    # pre-publication audit. Asserting a security control that does not
    # execute is the same class of mistake as the crash-resumability
    # guarantee in README.md's design-decisions section: a claim, not a
    # property. This job is the property.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install detect-secrets
        # Pinned to the same rev as .pre-commit-config.yaml, so the hook
        # and this job cannot disagree about what counts as a secret.
        run: |
          # The pragma is on this line because detect-secrets flags its
          # own version pin: "secrets==1.5.0" matches its Secret Keyword
          # pattern. Same line as the finding is where the filter looks.
          pip install "detect-secrets==1.5.0"  # pragma: allowlist secret
      - name: No secret outside the audited baseline
        # scripts/check_no_new_secrets.py rather than detect-secrets'
        # own entry points: `scan --baseline` and `detect-secrets-hook`
        # both rewrite the baseline for bookkeeping (line numbers, their
        # own filter list) and exit non-zero asking for it to be
        # committed. The hook did that on this runner while exiting 0 on
        # Windows for an identical tree, which made the check depend on
        # the OS rather than on whether a secret existed. The script
        # compares (path, hash) pairs and ignores everything incidental.
        # Its failure path is tested: a planted AWS key is caught.
        run: python scripts/check_no_new_secrets.py

  constraints:
    name: Constraints (C1, C4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No gap markers (C1)
        run: bash scripts/check_no_gap_markers.sh
      - name: Docker images pinned (C4)
        run: bash scripts/check_pinned_images.sh
      - name: No fabricated detection-performance numbers (DEFENSE.md #9)
        run: bash scripts/check_no_metrics_in_markdown.sh

  benchmark-readme-sync:
    name: README benchmark table matches latest results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check README benchmark block is not stale
        run: python scripts/sync_benchmark_readme.py --check

  test:
    # Was two jobs (a Docker-less "test" that always failed with pytest
    # exit 5 - no tests existed - and "integration", which ran
    # smoke_test.sh directly, bypassing pytest entirely). Merged once
    # tests/unit/test_sync_benchmark_readme.py and tests/integration/
    # test_smoke.py existed for real: the integration test needs the
    # live stack, so it has to run where the stack is up, and there's no
    # reason to run the stack twice for two separate test jobs.
    name: Test suite (C5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest and the suite's own imports
        # pyarrow: tests/integration/test_load_pickup_timestamps.py
        # imports it at module scope, so a missing pyarrow is a
        # collection ERROR, not the graceful skip its skipif intends.
        # psycopg: already a project dependency (no new dependency, hard
        # rule 6), needed by test_detector_crash_resumability.py, which
        # talks to the compose Postgres directly. Installed from the
        # requirements file so the pin stays in one place.
        run: |
          pip install pytest pyarrow
          pip install -r reliability/volume/requirements.txt
      - name: Start stack
        run: docker compose up -d --build
      - name: Capture Flink lib/ jar manifest
        # Unconditional, not just on failure - so a future pass/fail pair
        # can be diffed directly instead of speculated about. Motivated
        # by an unresolved step-5 inconsistency between two otherwise-
        # identical CI runs (see DEFENSE.md #15) - this makes "was the
        # actual jar content identical between the two runs" answerable
        # from evidence next time, not a re-run of the same guesswork.
        run: |
          docker compose exec -T flink-jobmanager sh -c '
            ls -la /opt/flink/lib/
            sha256sum /opt/flink/lib/*.jar
          '
      - name: Run tests (unit + integration)
        # -rs: report every skip with its reason. Without it the summary
        # is just a count, and a test that quietly skipped in CI is
        # indistinguishable from one that ran - which matters most for
        # the tests that guard a claim rather than compute a value.
        run: pytest -q -rs tests/
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
