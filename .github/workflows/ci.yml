name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  constraints:
    name: Constraints (C1, C4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No gap markers (C1)
        run: bash scripts/check_no_gap_markers.sh
      - name: Docker images pinned (C4)
        run: bash scripts/check_pinned_images.sh
      - name: No fabricated detection-performance numbers (DEFENSE.md #9)
        run: bash scripts/check_no_metrics_in_markdown.sh

  benchmark-readme-sync:
    name: README benchmark table matches latest results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check README benchmark block is not stale
        run: python scripts/sync_benchmark_readme.py --check

  test:
    name: Test suite (C5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        # No modules or tests exist yet, so this currently fails with
        # pytest exit 5 ("no tests collected"). That's expected: CLAUDE.md
        # C5 says CI runs every test and untested code is not done - this
        # job goes green only once real code and tests land together.
        run: pytest -q tests/

  integration:
    name: Integration smoke test - steps 2-5 (C5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build
      - name: Run smoke test (steps 2-5)
        run: bash scripts/smoke_test.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  debug-kafka-healthcheck:
    # TEMPORARY - diagnosing why Kafka's healthcheck never passes even
    # though Kafka's own logs show a clean startup. Remove this job once
    # the root cause is confirmed. Not gating anything; informational only.
    name: "DEBUG - Kafka healthcheck (temporary)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Show configured Kafka healthcheck settings from docker-compose.yml
        continue-on-error: true
        run: |
          sed -n '/^  kafka:/,/^  # ----/p' docker-compose.yml
      - name: Start Kafka only
        run: docker compose up -d kafka
      - name: Wait for Kafka's own startup (not for Docker health)
        run: sleep 15
      - name: DEBUG - exec diagnostics inside the Kafka container
        run: |
          docker compose exec -T kafka sh -c '
            echo "=== 1. ls -la /opt/kafka/bin/ ===";
            ls -la /opt/kafka/bin/ | head -30;
            echo "";
            echo "=== 2. which kafka-broker-api-versions.sh ===";
            which kafka-broker-api-versions.sh;
            echo "exit=$?";
            echo "";
            echo "=== 3. PATH ===";
            echo "$PATH";
            echo "";
            echo "=== 4. time kafka-broker-api-versions.sh (absolute path) ===";
            time /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092;
            echo "exit=$?";
          '
      - name: Tear down
        if: always()
        run: docker compose down -v
