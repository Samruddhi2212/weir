name: Scoring throughput probe

# Sizing instrument for the benchmark, not a verification gate.
#
# Benchmark run 34757520031 spent 1h12m on replay and then 4h36m silently
# inside clean-phase detector scoring before the 350-minute ceiling killed
# it. This probe seeds window_metrics directly and times the scoring half
# alone, so the feasible contiguous span comes from a measurement rather
# than an estimate. Postgres only - no Kafka, Flink, or TLC download.
#
# Nothing here touches detector logic (hard rule 3). The single variable
# is synchronous_commit, which changes durability, not any scored value.
on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Consecutive one-minute windows to seed and score (120960 = 12 weeks)"
        required: false
        default: "20000"
      settings:
        description: "Comma-separated synchronous_commit values to measure"
        required: false
        default: "on"

jobs:
  probe:
    name: Time detector scoring against a seeded window_metrics
    runs-on: ubuntu-latest
    # A full 12-week probe is ~120960 windows x 3 detectors at the
    # measured rate, plus seeding 8M column_metrics rows. Sized to let
    # that finish rather than to the 20000-window default.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # pyarrow is not a detector dependency, but the volume adapter
        # reaches DST_FALLBACK_AMBIGUOUS_HOURS through a parquet loader
        # module, so importing any detector needs it present.
        run: |
          pip install pyarrow
          pip install -r reliability/volume/requirements.txt
      - name: Start Postgres
        run: docker compose up -d postgres
      - name: Wait for Postgres healthy
        run: |
          WAITED=0
          MAX_WAIT=120
          until docker compose ps postgres | grep -q "(healthy)"; do
            WAITED=$((WAITED + 5))
            if [ "$WAITED" -ge "$MAX_WAIT" ]; then
              docker compose ps
              docker compose logs postgres
              echo "FAIL: postgres not healthy after ${MAX_WAIT}s"
              exit 1
            fi
            sleep 5
          done
          docker compose ps postgres
      - name: Apply both schemas
        run: |
          docker compose exec -T postgres psql -U weir -d weir_catalog \
            < reliability/store/schema.sql
          docker compose exec -T postgres psql -U weir -d weir_catalog \
            < reliability/store/incidents_schema.sql
      - name: Verify the Postgres activity sampler actually samples
        # It silently errored on every one of 2044 attempts during
        # benchmark run 35008661410 and collected nothing, because a
        # row-constructor IN is not a thing psycopg can parameterise.
        # --samples exits non-zero if any sample failed, so the
        # instrument is now checked against a live Postgres rather than
        # trusted.
        run: |
          python -u scripts/sample_pg_activity.py \
            --out sampler-selftest.log \
            --interval 1 --heartbeat 1 --samples 3 \
            --port "${POSTGRES_PORT:-5432}"
          cat sampler-selftest.log
      - name: Probe
        run: |
          python -u scripts/probe_scoring_throughput.py \
            --windows "${{ github.event.inputs.windows }}" \
            --settings "${{ github.event.inputs.settings }}" \
            --port "${POSTGRES_PORT:-5432}"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Tear down
        if: always()
        run: docker compose down -v
