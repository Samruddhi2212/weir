# ============================================================
# Weir - Local Infrastructure
# ============================================================
# Kafka (KRaft), PostgreSQL, SeaweedFS (S3-compatible), Flink.
# Every pulled image is pinned to tag@digest, not just a tag. No :latest.
# A tag alone is mutable - the same tag can be repushed with different
# content later - so tag-only pinning doesn't actually guarantee
# reproducibility. Digests resolved from Docker Hub's registry API on
# 2026-08-17 (see DEFENSE.md #15); re-resolve and update if a version is
# deliberately bumped.
#
#   make up      # start all services
#   make down    # stop all services and remove volumes
#   make logs    # tail service logs
#   make seed    # create the warehouse bucket
#   make test    # run the test suite
# ============================================================

networks:
  weir:
    driver: bridge
    name: weir-network

volumes:
  kafka-data:
  postgres-data:
  seaweedfs-data:
  flink-checkpoints:
  flink-savepoints:

services:
  # ------------------------------------------------------------
  # Kafka (KRaft mode, combined broker+controller)
  # ------------------------------------------------------------
  kafka:
    image: apache/kafka:4.1.0@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f
    container_name: weir-kafka
    hostname: kafka
    networks:
      - weir
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------
  # PostgreSQL (Iceberg catalog metadata store)
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: weir-postgres
    hostname: postgres
    networks:
      - weir
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weir_catalog}
      POSTGRES_USER: ${POSTGRES_USER:-weir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weir}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weir} -d ${POSTGRES_DB:-weir_catalog}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------
  # SeaweedFS (S3-compatible object store)
  # ------------------------------------------------------------
  # Chosen over MinIO (server AGPLv3; community repo archived
  # 2026-04-25, no further releases or security patches) and
  # LocalStack (since 2026-03, requires an auth-token account to
  # pull/run even the free tier). SeaweedFS is Apache-2.0 and
  # actively released.
  seaweedfs:
    image: chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d
    container_name: weir-seaweedfs
    hostname: seaweedfs
    networks:
      - weir
    ports:
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333"
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
      - "${SEAWEEDFS_FILER_PORT:-8888}:8888"
    command: server -s3 -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9333/cluster/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ------------------------------------------------------------
  # Iceberg REST Catalog
  # ------------------------------------------------------------
  # Added after discovering (5/5 reproducible CI failures, confirmed
  # against Iceberg 1.11.0's own source) that Iceberg's Flink integration
  # never supports catalog-type=jdbc at all - only hive, hadoop, or rest.
  # See DEFENSE.md #21. tabulario/iceberg-rest is the same image
  # reference/ used for this; note it's a "sample image for
  # experimentation and testing" per its own Docker Hub description, last
  # pushed over a year before this pin, not an actively maintained
  # production artifact - same category of scrutiny this project already
  # applied to MinIO/SeaweedFS/LocalStack.
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0@sha256:3b7d31bdfec626b68e97531c9778a1b9119659e456fe28545a49f6aa6a9ce472
    container_name: weir-iceberg-rest
    hostname: iceberg-rest
    networks:
      - weir
    ports:
      - "${ICEBERG_REST_PORT:-8181}:8181"
    environment:
      CATALOG_WAREHOUSE: s3a://weir-warehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_ACCESS__KEY__ID: ${WEIR_S3_ACCESS_KEY:-admin}
      CATALOG_S3_SECRET__ACCESS__KEY: ${WEIR_S3_SECRET_KEY:-password123}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-weir_catalog}
      CATALOG_JDBC_USER: ${POSTGRES_USER:-weir}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-weir}
      # AWS SDK v2 always requires a resolvable region, even against
      # non-AWS S3-compatible storage where the region is functionally
      # meaningless - confirmed via the actual exception this produced
      # (SdkClientException: Unable to load region from any of the
      # providers in the chain). See DEFENSE.md #23.
      AWS_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      # Not curl: this image's own Dockerfile (databricks/iceberg-rest-
      # image) is FROM azul/zulu-openjdk:17-jre-headless, a minimal JRE
      # image with no curl or wget installed at all - confirmed from its
      # actual Dockerfile, not assumed. Same bug class as the Kafka
      # healthcheck (DEFENSE.md #12), caught before it shipped this time.
      # bash's own /dev/tcp is a TCP-connect check only, not a real HTTP
      # health check (no verification of a 200 response) - weaker than
      # curl would have been, but actually runs, and Debian-based Azul
      # Zulu images do include bash.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8181' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------
  # Flink JobManager
  # ------------------------------------------------------------
  flink-jobmanager:
    image: weir/flink-iceberg:2.1.0-1.11.0
    build:
      context: ./docker/flink
      dockerfile: Dockerfile
    container_name: weir-flink-jobmanager
    hostname: flink-jobmanager
    networks:
      - weir
    ports:
      - "${FLINK_JOBMANAGER_UI_PORT:-8081}:8081"
      - "${FLINK_JOBMANAGER_RPC_PORT:-6123}:6123"
    environment:
      # Appended to conf/config.yaml by the image's entrypoint at
      # container start. Lets the sensitivity sweep vary checkpoint
      # interval without editing config/flink/config.yaml. See
      # DEFENSE.md #1.
      #
      # The conf mount below is NOT :ro: the entrypoint's config-parser-
      # utils.sh needs to write into it to merge FLINK_PROPERTIES in.
      # Confirmed by a crash: read-only produced "Read-only file system"
      # from config-parser-utils.sh, matching a known upstream issue
      # (GoogleCloudPlatform/flink-on-k8s-operator#213).
      FLINK_PROPERTIES: |
        execution.checkpointing.interval: ${WEIR_CHECKPOINT_INTERVAL:-60s}
      # Same AWS SDK v2 region requirement as iceberg-rest's - Flink's
      # own S3FileIO client (writing actual data files) hits the
      # identical SdkClientException otherwise. See DEFENSE.md #23.
      AWS_REGION: us-east-1
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-savepoints:/tmp/flink-savepoints
      # This mount REPLACES the image's entire /opt/flink/conf directory,
      # not merges into it - including the image's own default
      # log4j-console.properties. config/flink/ has to carry its own copy
      # (see PROVENANCE.md), or log4j falls back to essentially no
      # console output at all ("Reconfiguration failed: No configuration
      # found..."), confirmed the hard way across several real CI runs
      # before this was understood - see DEFENSE.md #26.
      - ./config/flink:/opt/flink/conf
      # Committed, reviewable SQL fixtures (see DEFENSE.md #10) - read-only
      # is fine here, unlike the conf mount above, since nothing needs to
      # write into it.
      - ./scripts/sql:/opt/weir/sql:ro
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------
  # Flink TaskManager
  # ------------------------------------------------------------
  flink-taskmanager:
    image: weir/flink-iceberg:2.1.0-1.11.0
    build:
      context: ./docker/flink
      dockerfile: Dockerfile
    container_name: weir-flink-taskmanager
    hostname: flink-taskmanager
    networks:
      - weir
    environment:
      FLINK_PROPERTIES: |
        execution.checkpointing.interval: ${WEIR_CHECKPOINT_INTERVAL:-60s}
      AWS_REGION: us-east-1
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-savepoints:/tmp/flink-savepoints
      - ./config/flink:/opt/flink/conf
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f taskmanager || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
